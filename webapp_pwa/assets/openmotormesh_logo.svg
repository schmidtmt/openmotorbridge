<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="omm-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="omm-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="omm-dark-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151221"/>
      <stop offset="100%" stop-color="#090712"/>
    </linearGradient>
    <filter id="omm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Badge with Tech Hexagon Ring -->
  <rect width="500" height="500" rx="60" fill="url(#omm-dark-grad)" stroke="#2d224d" stroke-width="4"/>

  <!-- Outer Glowing Circle -->
  <circle cx="250" cy="210" r="150" fill="none" stroke="url(#omm-purple-grad)" stroke-width="3" stroke-dasharray="12 6" opacity="0.6" filter="url(#omm-glow)"/>

  <!-- Mesh Star Constellation Vectors -->
  <!-- Outer Mesh Lines -->
  <polygon points="250,90 375,160 375,300 250,370 125,300 125,160" fill="none" stroke="url(#omm-cyan-grad)" stroke-width="3" opacity="0.8" filter="url(#omm-glow)"/>

  <!-- Cross Interconnects -->
  <line x1="250" y1="90" x2="250" y2="370" stroke="rgba(217, 70, 239, 0.4)" stroke-width="2"/>
  <line x1="125" y1="160" x2="375" y2="300" stroke="rgba(217, 70, 239, 0.4)" stroke-width="2"/>
  <line x1="125" y1="300" x2="375" y2="160" stroke="rgba(217, 70, 239, 0.4)" stroke-width="2"/>

  <!-- Peripheral Mesh Nodes -->
  <circle cx="250" cy="90" r="10" fill="#06b6d4" filter="url(#omm-glow)"/>
  <circle cx="375" cy="160" r="10" fill="#d946ef" filter="url(#omm-glow)"/>
  <circle cx="375" cy="300" r="10" fill="#06b6d4" filter="url(#omm-glow)"/>
  <circle cx="250" cy="370" r="10" fill="#d946ef" filter="url(#omm-glow)"/>
  <circle cx="125" cy="300" r="10" fill="#06b6d4" filter="url(#omm-glow)"/>
  <circle cx="125" cy="160" r="10" fill="#d946ef" filter="url(#omm-glow)"/>

  <!-- Center Master Hub (Cluster Leader) -->
  <circle cx="250" cy="210" r="42" fill="url(#omm-purple-grad)" filter="url(#omm-glow)"/>
  <circle cx="250" cy="210" r="48" fill="none" stroke="#06b6d4" stroke-width="4"/>

  <!-- Stylized Helmet Icon in Center Hub -->
  <path d="M 232 205 C 232 188, 268 188, 268 205 L 268 220 C 268 228, 232 228, 232 220 Z" fill="#ffffff"/>
  <!-- Visor -->
  <path d="M 236 208 L 264 208 L 260 216 L 240 216 Z" fill="#090712"/>

  <!-- RF Waves Center -->
  <path d="M 235 155 A 18 18 0 0 1 265 155" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
  <path d="M 225 142 A 30 30 0 0 1 275 142" fill="none" stroke="#d946ef" stroke-width="4" stroke-linecap="round"/>

  <!-- Typography: OpenMotorMesh -->
  <text x="250" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4">
    OPEN<tspan fill="#06b6d4">MOTOR</tspan><tspan fill="#d946ef">MESH</tspan>
  </text>
  <text x="250" y="450" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a78bfa" letter-spacing="6">
    DECENTRALIZED AD-HOC PROTOCOL
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="omb-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="omb-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>
    <linearGradient id="omb-dark-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#090b0e"/>
    </linearGradient>
    <filter id="omb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Badge -->
  <rect width="500" height="500" rx="60" fill="url(#omb-dark-grad)" stroke="#232a35" stroke-width="4"/>

  <!-- Tech Grid Background Pattern -->
  <path d="M 50 100 L 450 100 M 50 200 L 450 200 M 50 300 L 450 300 M 50 400 L 450 400" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>
  <path d="M 100 50 L 100 450 M 200 50 L 200 450 M 300 50 L 300 450 M 400 50 L 400 450" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>

  <!-- Radio Soundwave Pulses -->
  <path d="M 80 230 Q 140 180 200 230 T 320 230 T 420 230" fill="none" stroke="url(#omb-orange-grad)" stroke-width="3" opacity="0.7" filter="url(#omb-glow)"/>
  <path d="M 120 210 L 150 160 L 180 250 L 210 170 L 250 270 L 290 170 L 320 250 L 350 160 L 380 210" fill="none" stroke="#ff9900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" filter="url(#omb-glow)"/>

  <!-- Twin Bridge Arches (The Bridge Emblem) -->
  <!-- Left Arch (Cyan) -->
  <path d="M 70 340 C 90 140, 210 140, 245 280" fill="none" stroke="url(#omb-cyan-grad)" stroke-width="16" stroke-linecap="round" filter="url(#omb-glow)"/>
  <!-- Right Arch (Orange) -->
  <path d="M 255 280 C 290 140, 410 140, 430 340" fill="none" stroke="url(#omb-orange-grad)" stroke-width="16" stroke-linecap="round" filter="url(#omb-glow)"/>

  <!-- Wireless Broadcast Waves Top Center -->
  <path d="M 225 115 A 35 35 0 0 1 275 115" fill="none" stroke="#ff9900" stroke-width="5" stroke-linecap="round" filter="url(#omb-glow)"/>
  <path d="M 210 95 A 55 55 0 0 1 290 95" fill="none" stroke="#ff9900" stroke-width="5" stroke-linecap="round" filter="url(#omb-glow)"/>

  <!-- Stylized Motorcycle Silhouette Center -->
  <g transform="translate(170, 240) scale(0.65)" filter="url(#omb-glow)">
    <!-- Wheels -->
    <circle cx="20" cy="110" r="30" fill="none" stroke="#00f2fe" stroke-width="8"/>
    <circle cx="20" cy="110" r="14" fill="#00f2fe"/>
    <circle cx="200" cy="110" r="30" fill="none" stroke="#00f2fe" stroke-width="8"/>
    <circle cx="200" cy="110" r="14" fill="#00f2fe"/>
    <!-- Chassis / Fairing Body -->
    <path d="M 20 110 L 80 80 L 110 50 L 150 40 L 180 65 L 200 110 L 140 100 L 110 75 L 80 110 Z" fill="url(#omb-cyan-grad)"/>
    <!-- Windscreen / Headlight -->
    <path d="M 150 40 L 170 20 L 185 38 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Typography: OpenMotorBridge -->
  <text x="250" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4">
    OPEN<tspan fill="#ff9900">MOTOR</tspan><tspan fill="#00f2fe">BRIDGE</tspan>
  </text>
  <text x="250" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#8e99a8" letter-spacing="6">
    UNIVERSAL CROSS-MESH BRIDGE
  </text>
</svg>

# OpenMotorBridge - Smart Keyfob & Silent Pager Configuration
# Nordic Semiconductor nRF52840 (ARM Cortex-M4F)

# 1. System & RTOS
CONFIG_CPLUSPLUS=y
CONFIG_STD_CPP17=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

# 2. Power Management & Low Power Sleep (< 25 µA target)
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_TICKLESS_KERNEL=y

# 3. Hardware Drivers
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y

# 4. Bluetooth Low Energy 5.4 Stack
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="OMB-KEYFOB"
CONFIG_BT_DEVICE_APPEARANCE=964
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# 5. Crypto & Hardware RNG
CONFIG_ENTROPY_GENERATOR=y
CONFIG_CRYPTO=y
CONFIG_CRYPTO_NRF_ECB=y

# 6. Logging & Console
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
